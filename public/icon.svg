<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#963457" />
      <stop offset="50%" stop-color="#7D2948" />
      <stop offset="100%" stop-color="#3D1222" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#E8C547" />
      <stop offset="100%" stop-color="#C49B28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Golden Halo Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Elegant Storybook Silhouette behind monogram -->
  <path d="M160 350 C 200 330, 240 335, 256 345 C 272 335, 312 330, 352 350 L 352 360 C 312 342, 272 346, 256 356 C 240 346, 200 342, 160 360 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Central Story Monogram 'S' -->
  <text x="256" y="325" font-family="'Fraunces', 'Times New Roman', Georgia, serif" font-size="230" font-weight="800" font-style="italic" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">S</text>

  <!-- Audio Waves Motif on sides -->
  <path d="M115 220 Q 110 256 115 292" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <path d="M98 200 Q 90 256 98 312" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  
  <path d="M397 220 Q 402 256 397 292" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <path d="M414 200 Q 422 256 414 312" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- Sparkle Star in upper corner -->
  <path d="M360 130 Q 360 150 340 150 Q 360 150 360 170 Q 360 150 380 150 Q 360 150 360 130 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="360" cy="150" r="3" fill="#FFFFFF" />
</svg>
